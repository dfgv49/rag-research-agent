    expected_doc_uuids:
      - 36c3bce7-8896-906e-13d4-07dfd2af0855   # 5: StateGraph(State, config_schema=ConfigSchema) + 节点内读取
      - 6ee46061-138a-5b3c-e23c-1fef1489cfc4   # 28: config_schema 让一张图切多模型
    expected_answer_hint: "用 StateGraph(State, config_schema=ConfigSchema) 声明可配置字段，调用时通过 config={'configurable': {...}} 传入，节点函数里用 config.get('configurable', {}).get('llm') 读到。"
    TODO: false

