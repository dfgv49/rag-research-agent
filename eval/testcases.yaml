# =============================================================================
# eval/testcases.yaml —— RAG Research Agent 分层评测集（5 类 × 12 条 = 60 条）
# =============================================================================
#
# 【字段说明】
#   id                   : 全局唯一 ID，命名规则 <类前缀>_<两位序号>
#                          前缀：cs=cross_section, et=exact_term, mt=multi_turn,
#                                na=no_answer, pe=permission
#   category             : 五选一（英文枚举值，见下方【类别定义】）
#   question             : 当前轮的用户提问。要写得像真实用户口吻，不要直接抄文档标题
#   history              : 可选，多轮对话的历史轮次（字符串列表，按时间正序）。
#                          只有 multi_turn 类别必须带；其余类别留空或省略
#   expected_doc_uuids   : 期望被召回的文档 uuid 列表。
#                          uuid 的算法 = md5(page_content) → 转成标准 uuid 字符串，
#                          即 src/shared/state.py 里的 _generate_uuid()。
#                          语料仅 32 篇，uuid 全部来自 src/sample_docs.json
#   expected_answer_hint : 可选，参考答案要点。生成侧评测（context_recall）用它当参照
#   user_id              : 可选，发起请求的用户
#   allowed_user_ids     : 可选，该用户被允许看到的文档 owner 列表（权限过滤用）
#   TODO                 : 布尔。true = 占位条目，run_eval.py 会跳过并计入 skipped
#
# 【类别定义】
#   cross_section : 跨小节 / 跨文档的综合问题，答案需要合并多处信息
#   exact_term    : 精确术语、缩写、符号查找（如 config_schema、input_schema、add_messages）
#   multi_turn    : 多轮指代追问，必须带 history 字段
#   no_answer     : 语料里确实没有答案，期望系统拒答而不是编造（expected_doc_uuids 留空）
#   permission    : 越权访问用例，带 user_id + allowed_user_ids，期望被过滤掉
#
# 【填写规则】
#   1. expected_doc_uuids 必须能在 src/sample_docs.json 里按 _generate_uuid 规则算出来，
#      不要凭印象填。可以用下面的命令核对：
#        .\.venv\Scripts\python.exe -c "import json,sys; sys.path.insert(0,'src'); from shared.state import _generate_uuid; [print(_generate_uuid(d['page_content']), d['page_content'][:60].replace(chr(10),' ')) for d in json.load(open('src/sample_docs.json',encoding='utf-8'))]"
#   2. 一条用例的 expected_doc_uuids 只放「确实包含答案」的文档，不要为了凑数把相关但不含答案的文档塞进来，
#      否则 Recall / nDCG / MRR 会被虚高或无意义地拉低。
#   3. 补完一条用例后把 TODO 改成 false（或整行删掉），run_eval.py 才会真正评它。
#   4. no_answer 类别的 expected_doc_uuids 必须是空列表 []；它不参与检索指标，
#      只统计「是否正确拒答」。
#   5. permission 类别需要语料带 owner 元数据才有意义；当前 src/sample_docs.json
#      的 metadata 只有 source 字段，没有 owner / allowed_user_ids，
#      所以这一类的 12 条全部是 TODO 占位，需要先给语料补 ACL 元数据才能真正启用。
#      详见 eval/README.md 的「已知限制」。
#
# 【当前填写状态】真实可用 24 条 / TODO 占位 36 条
#   cross_section 7 真 + 5 TODO | exact_term 8 真 + 4 TODO | multi_turn 4 真 + 8 TODO
#   no_answer     5 真 + 7 TODO | permission 0 真 + 12 TODO
# =============================================================================

meta:
  version: 1
  corpus: src/sample_docs.json
  corpus_size: 32
  total_cases: 60
  uuid_rule: "md5(page_content) -> uuid.UUID"  # 见 src/shared/state.py::_generate_uuid

