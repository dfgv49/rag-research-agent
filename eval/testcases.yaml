  - id: cs_01
    category: cross_section
    question: "我有一批要处理的对象，想让同一层的几个节点同时跑起来，LangGraph 里该怎么写？它和 LangChain 链里那种并行是一回事吗？"
    expected_doc_uuids:
      - f8b51515-e326-3361-9f69-795a87212082   # 24: 一个节点多条出边 → 下一个 superstep 并行
      - d683ad55-fbc6-2d7f-3d2d-03b47a82190d   # 20: LCEL 的 optimized parallel execution
    expected_answer_hint: "LangGraph 中一个节点有多条出边时，所有目标节点会在下一个 superstep 里并行执行；LangChain 的 LCEL 也会把可并行的步骤做优化并行执行。两者都是并行，但 LangGraph 是按图结构决定并行、LCEL 是按链的依赖关系决定并行。"
    TODO: false

