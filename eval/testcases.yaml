    expected_doc_uuids:
      - 69d5fd0f-5b9d-2fba-6111-1737354195cd   # 26: TypedDict + Annotated reducer / MessagesState
      - f8b51515-e326-3361-9f69-795a87212082   # 24: class State(MessagesState) 追加字段
      - 38d2d271-936e-8fa7-8759-a92098869995   # 13: Annotated 与 input/output/private state
    expected_answer_hint: "TypedDict 是基础写法，字段要合并而不是覆盖时用 Annotated[类型, reducer] 指定 reducer；MessagesState 是预置的、带 add_messages reducer 的状态，适合以消息列表为核心的对话场景，可以在它基础上再加自己的字段。"
    TODO: false

  - id: cs_04
