    expected_answer_hint: "可以用 rerank 重排、contextual compression 压缩上下文、ColBERT 这类更细粒度的向量、ensemble 组合多个检索器；检索后还可以上 Corrective RAG 之类的自纠正范式，检索不到就回退到别的来源。"
