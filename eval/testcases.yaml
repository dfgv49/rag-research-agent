      - f8b51515-e326-3361-9f69-795a87212082   # 24: add_conditional_edges 与 routing_function
    expected_answer_hint: "普通条件边返回节点名或节点名列表；如果下游数量在运行时才确定，就从条件边返回 Send 对象列表，Send(节点名, 该节点的状态) 用来实现 map-reduce 式的动态 fan-out。"
    TODO: false

